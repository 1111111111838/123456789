; ============================================================================
;  UnisocDumpTool.ini - parameters for a REAL hardware dump
;
;  Copy this file to "UnisocDumpTool.ini" next to UnisocDumpTool.exe and edit
;  the values for YOUR device. These values are deliberately NOT guessed by the
;  program: the flash size, base address and the FDL images come from the
;  device's own flashing package (PAC). See docs/MISSING.md for how to obtain
;  them. "Simulated Dump" in the UI needs none of this.
; ============================================================================

[flash]
; Total number of bytes to read from flash. REQUIRED for a real dump.
; Example: 8 MiB. Use the exact size reported for your chip's flash.
size      = 0x800000

; First address (or partition base) to read from.
base_addr = 0x00000000

; Bytes per read request. 1024 is safe; larger can be faster if the chip allows.
chunk     = 1024

; Link speed for the COM port. 115200 is the common default; some loaders
; negotiate a higher rate.
baud      = 115200

; Read method: auto | linear | fdl2
;   linear - BSL_CMD_READ_FLASH by address (older/simple paths)
;   fdl2   - partitioned READ_FLASH_START/MIDST/END (needs an FDL2 running)
;   auto   - fdl2 if an FDL2 image is given below, otherwise linear
method    = auto

[fdl]
; Chip-specific loaders. Most chips CANNOT read flash without these.
; They are proprietary and are NOT shipped with this tool - extract them from
; the matching PAC for your exact SoC and point to them here. Leave blank to
; skip (only works on the rare chips whose Boot ROM can read directly).
fdl1      =
fdl1_addr = 0x00000000
fdl2      =
fdl2_addr = 0x00000000
