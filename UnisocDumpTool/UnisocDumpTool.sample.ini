; ============================================================================
;  UnisocDumpTool.ini - OPTIONAL parameters for a REAL hardware dump
;
;  This file is OPTIONAL. By default the tool runs FDL-FREE: it reads flash
;  directly through the Boot ROM (BSL_CMD_READ_FLASH), no FDL required, and
;  uses a default read size if none is given below. Copy this file to
;  "UnisocDumpTool.ini" next to UnisocDumpTool.exe only if you want to override
;  the defaults for YOUR device. "Simulated Dump" needs none of this.
; ============================================================================

[flash]
; Total number of bytes to read. OPTIONAL - if omitted, an 8 MiB default is
; used (and clearly logged). Set it for an exact extent, e.g. 8 MiB below.
size      = 0x800000

; First address to read from (0 for a full linear dump from the start).
base_addr = 0x00000000

; Bytes per read request. 1024 is safe; larger can be faster if the chip allows.
chunk     = 1024

; Link speed for the COM port. 115200 is the common default.
baud      = 115200

; Read method: auto | linear | fdl2
;   linear - BSL_CMD_READ_FLASH by address (FDL-FREE, the default)
;   fdl2   - partitioned READ_FLASH_START/MIDST/END (needs an FDL2 running)
;   auto   - fdl2 if an FDL2 image is given below, otherwise linear
; With no FDL configured, the tool always uses the FDL-free linear path.
method    = linear

[fdl]
; OPTIONAL fallback ONLY. Leave blank for FDL-free operation (default).
; If your specific chip's Boot ROM refuses direct reads, you can supply the
; chip-specific loaders here (extracted from the device PAC) and the tool will
; stage them first. They are proprietary and are NOT shipped with this tool.
fdl1      =
fdl1_addr = 0x00000000
fdl2      =
fdl2_addr = 0x00000000
